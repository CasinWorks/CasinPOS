name: casinpos
description: "CasinPOS - retail point of sale for tablets"
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^15.1.2
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  collection: ^1.19.1
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  image_picker: ^1.2.3
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  mobile_scanner: ^7.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFC107"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#FFC107"
    theme_color: "#FFC107"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/casinpos_logo.png
    - assets/branding/casinpos_duck.png
    - assets/branding/app_icon.png
