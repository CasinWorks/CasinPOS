# FoodPos local Supabase project (optional).
# Install CLI: https://supabase.com/docs/guides/cli
# Then: supabase start && supabase db reset

project_id = "foodpos"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[functions.send-invite-email]
verify_jwt = true

[functions.create-store-invitation]
verify_jwt = true

[functions.create-premium-checkout]
verify_jwt = true

[functions.paymongo-webhook]
verify_jwt = false

[functions.expire-paymongo-premium]
verify_jwt = false

[auth]
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:5000",
  "http://localhost:8080",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:5000",
  "http://127.0.0.1:8080",
  "https://pos.casinworks.com",
  "https://pos.casinworks.com/reset-password",
  "https://pos.casinworks.com/intro",
  "https://pos.casinworks.com/invite",
  "https://pos.casinworks.com/join",
]
site_url = "https://pos.casinworks.com"

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
